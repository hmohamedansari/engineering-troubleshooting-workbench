[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-troubleshooting-workbench"
version = "0.1.0"
description = "A local learning application that grows from deterministic automation into bounded agentic systems."
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.37,<2",
  "mcp>=2,<3",
  "a2a-sdk>=1,<2",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "prometheus-client>=0.26,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
workbench = "workbench.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
