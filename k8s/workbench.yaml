apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-troubleshooting-workbench
  labels:
    app.kubernetes.io/name: engineering-troubleshooting-workbench
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: engineering-troubleshooting-workbench
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-troubleshooting-workbench
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workbench
          image: engineering-troubleshooting-workbench:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: engineering-troubleshooting-workbench
spec:
  selector:
    app.kubernetes.io/name: engineering-troubleshooting-workbench
  ports:
    - port: 8501
      targetPort: 8501
