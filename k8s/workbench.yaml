apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-troubleshooting-workbench
  labels:
    app.kubernetes.io/name: engineering-troubleshooting-workbench
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: engineering-troubleshooting-workbench
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-troubleshooting-workbench
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workbench
          image: engineering-troubleshooting-workbench:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
            - containerPort: 9100
              name: metrics
          env:
            - name: WORKBENCH_STATE_DIR
              value: /tmp/workbench-state
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: workbench-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: workbench-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: engineering-troubleshooting-workbench
spec:
  selector:
    app.kubernetes.io/name: engineering-troubleshooting-workbench
  ports:
    - port: 8501
      targetPort: http
      name: http
    - port: 9100
      targetPort: metrics
      name: metrics
